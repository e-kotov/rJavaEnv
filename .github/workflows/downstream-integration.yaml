name: Downstream Java Integration

on:
  push:
    branches: [main, feature/downstream-java-integration]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  downstream:
    name: Downstream (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        id: java17
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-java@v4
        id: java21
        with:
          distribution: temurin
          java-version: '21'
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::callr
            any::rJava
      - name: Test installed downstream packages in fresh R processes
        env:
          RJE_JAVA_HOME_A: ${{ steps.java17.outputs.path }}
          RJE_JAVA_HOME_B: ${{ steps.java21.outputs.path }}
        shell: Rscript {0}
        run: source('tools/test-downstream.R')
