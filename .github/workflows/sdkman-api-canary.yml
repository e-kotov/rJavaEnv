name: SDKMAN Upstream API Canary

on:
  schedule:
    # Runs daily at 06:00 UTC
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  canary:
    name: Probe SDKMAN API
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run SDKMAN Canary
        id: canary
        run: |
          chmod +x tools/sdkman-canary.sh
          ./tools/sdkman-canary.sh

      - name: Open or update GitHub Issue on failure
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ISSUE_TITLE="⚠️ SDKMAN Upstream API Schema / Contract Drift Detected"
          ISSUE_BODY="The daily SDKMAN API canary job failed. This indicates that SDKMAN changed their endpoint formats or responses.

Run logs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          
          EXISTING_ISSUE=$(gh issue list --search "$ISSUE_TITLE" --state open --json number --jq '.[0].number')
          if [ -n "$EXISTING_ISSUE" ]; then
            gh issue comment "$EXISTING_ISSUE" --body "Canary failed again: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          else
            gh issue create --title "$ISSUE_TITLE" --body "$ISSUE_BODY" || true
          fi
